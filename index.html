<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ColorMe — a calm coloring studio</title>
  <meta name="description" content="Upload any image, turn it into an outline, then paint it in zen or manual mode with realistic brushes." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f6c1c1'/%3E%3Ccircle cx='22' cy='26' r='8' fill='%23ffe8a3'/%3E%3Ccircle cx='42' cy='26' r='8' fill='%23c5e8d3'/%3E%3Ccircle cx='32' cy='42' r='8' fill='%23b8d4f0'/%3E%3C/svg%3E" />
  <script>
    // Set theme synchronously before CSS paints — avoids flash + ensures
    // dark mode works even if app.js later errors out.
    (function () {
      try {
        var saved = localStorage.getItem("colorme-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn panel-toggle" id="panel-toggle" title="Show controls" aria-label="Show controls" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>ColorMe</h1>
      <span class="tagline">a quiet place to paint</span>
    </div>

    <div class="topbar-actions">
      <label class="btn ghost file-btn" title="Upload image">
        <input type="file" id="file-input" accept="image/*" hidden />
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3M12 3v12M7 8l5-5 5 5"/></svg>
        <span class="btn-label">Upload</span>
      </label>
      <button class="btn ghost" id="paste-btn" title="Paste image from clipboard (Cmd/Ctrl+V)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        <span class="btn-label">Paste</span>
      </button>
      <button class="btn ghost" id="sample-btn" title="Try a sample">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
        <span class="btn-label">Sample</span>
      </button>
      <button class="btn ghost" id="blank-btn" title="Start with an empty canvas">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        <span class="btn-label">Blank</span>
      </button>
      <button class="icon-btn" id="music-btn" title="Toggle music" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn" id="sound-btn" title="Toggle sound effects" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-pressed="false">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <aside class="panel left">
      <section class="panel-section">
        <h2>Mode</h2>
        <div class="mode-toggle mode-toggle-3">
          <button class="mode-btn active" data-mode="manual">
            <span class="mode-icon">✋</span>
            <span class="mode-label">Manual</span>
            <span class="mode-desc">Drag to paint</span>
          </button>
          <button class="mode-btn" data-mode="zen">
            <span class="mode-icon">🌿</span>
            <span class="mode-label">Zen</span>
            <span class="mode-desc">It paints itself</span>
          </button>
          <button class="mode-btn" data-mode="abstract">
            <span class="mode-icon">🌀</span>
            <span class="mode-label">Abstract</span>
            <span class="mode-desc">Fluid colors</span>
          </button>
        </div>
        <div class="zen-controls hidden">
          <button class="btn primary" id="zen-start">Start zen painting</button>
          <button class="btn ghost" id="zen-stop">Stop</button>
        </div>
      </section>

      <section class="panel-section paint-only">
        <h2>Brush</h2>
        <div class="brush-grid">
          <button class="brush-btn active" data-brush="crayon">
            <span class="swatch crayon-swatch"></span>
            <span>Crayon</span>
          </button>
          <button class="brush-btn" data-brush="pencil">
            <span class="swatch pencil-swatch"></span>
            <span>Pencil</span>
          </button>
          <button class="brush-btn" data-brush="watercolor">
            <span class="swatch water-swatch"></span>
            <span>Watercolor</span>
          </button>
          <button class="brush-btn" data-brush="acrylic">
            <span class="swatch acrylic-swatch"></span>
            <span>Acrylic</span>
          </button>
          <button class="brush-btn" data-brush="oil">
            <span class="swatch oil-swatch"></span>
            <span>Oil</span>
          </button>
          <button class="brush-btn" data-brush="marker">
            <span class="swatch marker-swatch"></span>
            <span>Marker</span>
          </button>
          <button class="brush-btn eraser-btn" data-brush="eraser">
            <span class="swatch eraser-swatch"></span>
            <span>Eraser</span>
          </button>
        </div>
        <label class="slider size-slider">
          <span>Size <em id="size-val">1.0×</em></span>
          <input type="range" min="0.5" max="2.5" step="0.25" value="1" id="size-slider" />
        </label>
      </section>

      <section class="panel-section">
        <h2>Color</h2>
        <div class="palette" id="palette"></div>
        <label class="custom-color">
          <span>Custom</span>
          <input type="color" id="custom-color" value="#f6a6b5" />
        </label>
      </section>

      <section class="panel-section paint-only">
        <h2>Outline</h2>
        <label class="slider">
          <span>Detail <em id="detail-val">medium</em></span>
          <input type="range" min="1" max="5" value="3" id="detail-slider" />
        </label>
        <label class="slider">
          <span>Line weight <em id="weight-val">2</em></span>
          <input type="range" min="1" max="4" value="2" id="weight-slider" />
        </label>
        <label class="slider">
          <span>Close gaps <em id="close-val">0</em></span>
          <input type="range" min="0" max="4" value="0" id="close-slider" />
        </label>
        <button class="btn ghost full" id="regen-btn">Regenerate outline</button>
      </section>

      <section class="panel-section abstract-only">
        <h2>Abstract</h2>
        <label class="checkbox-row">
          <input type="checkbox" id="abstract-usecolor" />
          <span>Use my color</span>
        </label>
        <label class="slider">
          <span>Splat size <em id="splat-size-val">0.25</em></span>
          <input type="range" min="0.10" max="0.80" step="0.05" value="0.25" id="splat-size-slider" />
        </label>
        <label class="slider">
          <span>Force <em id="splat-force-val">6000</em></span>
          <input type="range" min="1500" max="12000" step="500" value="6000" id="splat-force-slider" />
        </label>
        <label class="slider">
          <span>Swirl <em id="curl-val">30</em></span>
          <input type="range" min="0" max="50" step="1" value="30" id="curl-slider" />
        </label>
        <label class="slider">
          <span>Fade <em id="diss-val">2.9</em></span>
          <input type="range" min="0" max="4" step="0.1" value="2.9" id="diss-slider" />
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="abstract-bloom" checked />
          <span>Bloom glow</span>
        </label>
        <button class="btn ghost full" id="splat-btn">Random splash</button>
      </section>

      <section class="panel-section">
        <h2>Canvas</h2>
        <div class="history-row paint-only">
          <button class="btn ghost" id="undo-btn" title="Undo (Cmd/Ctrl+Z)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
            Undo
          </button>
          <button class="btn ghost" id="redo-btn" title="Redo (Cmd/Ctrl+Shift+Z)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
            Redo
          </button>
        </div>
        <button class="btn ghost full" id="clear-btn">Clear paint</button>
        <button class="btn ghost full paint-only" id="save-btn">Save image</button>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="welcome" id="welcome">
        <div class="welcome-art" aria-hidden="true">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
          <div class="blob b3"></div>
        </div>
        <h2>Pick an image to begin.</h2>
        <p>Any photo becomes a sketch. Then you can color it by hand, or sit back and let it paint itself.</p>
        <div class="welcome-actions">
          <label class="btn primary file-btn">
            <input type="file" accept="image/*" id="file-input-hero" hidden />
            Upload an image
          </label>
          <button class="btn ghost" id="sample-btn-hero">Try a sample</button>
          <button class="btn ghost" id="blank-btn-hero">Start blank</button>
        </div>
        <p class="tip">Tip: you can also paste an image with <kbd>⌘V</kbd>/<kbd>Ctrl+V</kbd>.</p>
      </div>

      <canvas id="fluid-canvas" class="fluid-canvas hidden"></canvas>

      <div class="canvas-wrap hidden" id="canvas-wrap">
        <canvas id="paint-canvas"></canvas>
        <canvas id="outline-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
        <div class="hand" id="hand" aria-hidden="true">
          <svg viewBox="0 0 80 100" width="80" height="100">
            <!-- brush handle -->
            <rect x="38" y="6" width="6" height="42" rx="2" fill="#7a4a2b" />
            <rect x="36" y="44" width="10" height="6" rx="1" fill="#c0a060" />
            <!-- bristles -->
            <path d="M34 50 Q41 66 41 72 Q41 66 48 50 Z" id="bristles" fill="#f6a6b5" />
            <!-- hand -->
            <path d="M26 60 Q22 70 24 82 Q28 96 44 96 Q60 96 64 84 Q66 72 60 60 Q56 54 52 58 Q50 50 46 54 Q44 48 40 52 Q38 46 34 50 Q30 54 26 60 Z" fill="#f3d3b3" stroke="#c79e7a" stroke-width="1"/>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <div class="panel-overlay" id="panel-overlay"></div>
  <div class="toast" id="toast" hidden></div>

  <!-- WebGL fluid simulation (MIT © 2017 Pavel Dobryakov, adapted) -->
  <script src="fluid.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
